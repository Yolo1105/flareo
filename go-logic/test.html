<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>City Card</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .transition-bar {
            transition: width 700ms ease-out;
        }
        
        .city-card:hover .rating-bar {
            width: var(--target-width);
        }

        .heart-button[aria-pressed="true"] svg {
            fill: #ef4444;
            stroke: #ef4444;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-gray-100 p-4">
    <div class="city-card group relative aspect-square w-full max-w-[400px] overflow-hidden rounded-lg cursor-pointer bg-white shadow-lg">
        <div class="relative h-full w-full">
            <!-- Image -->
            <img
                src="https://nomads.com/cdn-cgi/image/format=auto,fit=cover,width=600,height=300,quality=75/assets/img/places/bangkok-thailand.jpg"
                alt="Bangkok cityscape"
                class="h-full w-full object-cover"
            />

            <!-- Heart Button -->
            <button
                class="heart-button absolute top-4 right-4 z-20 rounded-full p-2 transition-all hover:scale-110 active:scale-95 bg-black/20 hover:bg-black/40"
                aria-pressed="false"
                hx-post="/like"
                hx-trigger="click"
                hx-swap="none"
                onclick="this.setAttribute('aria-pressed', this.getAttribute('aria-pressed') === 'true' ? 'false' : 'true')"
            >
                <svg 
                    class="h-5 w-5 transition-colors stroke-white stroke-2 fill-none"
                    viewBox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg"
                >
                    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                </svg>
            </button>

            <!-- Overlay -->
            <div class="absolute inset-0 transition-colors duration-300 bg-gradient-to-t from-black/60 to-transparent group-hover:bg-black/70"></div>

            <!-- Default State -->
            <div class="absolute inset-0 transition-all duration-300 group-hover:opacity-0 group-hover:translate-y-4">
                <!-- City Name and Country -->
                <div class="absolute bottom-4 left-4 text-white z-10">
                    <h2 class="text-3xl font-bold">Bangkok</h2>
                    <h3 class="text-lg opacity-90">Thailand</h3>
                </div>

                <!-- Cost -->
                <div class="absolute bottom-4 right-4 text-white text-right">
                    <p class="text-2xl font-bold">$1,499 / mo</p>
                    <p class="text-xs tracking-wide opacity-90">FOR A NOMAD</p>
                </div>
            </div>

            <!-- Hover State Ratings -->
            <div class="absolute inset-0 flex items-center opacity-0 translate-y-4 transition-all duration-300 group-hover:opacity-100 group-hover:translate-y-0">
                <div class="w-full space-y-6 px-8">
                    <!-- Overall -->
                    <div class="space-y-2">
                        <div class="text-base text-white flex items-center gap-2">
                            <span class="text-lg">⭐️</span>
                            <span class="font-medium">Overall</span>
                        </div>
                        <div class="h-3 w-full rounded-full bg-white/20">
                            <div class="rating-bar h-full w-0 rounded-full bg-emerald-500 shadow-lg transition-bar" style="--target-width: 90%"></div>
                        </div>
                    </div>

                    <!-- Cost -->
                    <div class="space-y-2">
                        <div class="text-base text-white flex items-center gap-2">
                            <span class="text-lg">💵</span>
                            <span class="font-medium">Cost</span>
                        </div>
                        <div class="h-3 w-full rounded-full bg-white/20">
                            <div class="rating-bar h-full w-0 rounded-full bg-emerald-500 shadow-lg transition-bar" style="--target-width: 100%"></div>
                        </div>
                    </div>

                    <!-- Internet -->
                    <div class="space-y-2">
                        <div class="text-base text-white flex items-center gap-2">
                            <span class="text-lg">📡</span>
                            <span class="font-medium">Internet</span>
                        </div>
                        <div class="h-3 w-full rounded-full bg-white/20">
                            <div class="rating-bar h-full w-0 rounded-full bg-red-500 shadow-lg transition-bar" style="--target-width: 40%"></div>
                        </div>
                    </div>

                    <!-- Liked -->
                    <div class="space-y-2">
                        <div class="text-base text-white flex items-center gap-2">
                            <span class="text-lg">👍</span>
                            <span class="font-medium">Liked</span>
                        </div>
                        <div class="h-3 w-full rounded-full bg-white/20">
                            <div class="rating-bar h-full w-0 rounded-full bg-yellow-500 shadow-lg transition-bar" style="--target-width: 60%"></div>
                        </div>
                    </div>

                    <!-- Safety -->
                    <div class="space-y-2">
                        <div class="text-base text-white flex items-center gap-2">
                            <span class="text-lg">👮</span>
                            <span class="font-medium">Safety</span>
                        </div>
                        <div class="h-3 w-full rounded-full bg-white/20">
                            <div class="rating-bar h-full w-0 rounded-full bg-emerald-500 shadow-lg transition-bar" style="--target-width: 80%"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
