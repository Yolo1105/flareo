version: '3'
services:
  model:
    build: ./model
    container_name: model
    hostname: model
    ports:
      - "9000:11434"   # 映射 11434 到宿主机 9000（仅用于外部调试）
    networks:
      - dsnet

  chat:
    build: ./chat
    ports:
      - "8080:80"
    depends_on:
      - model
    networks:
      - dsnet

networks:
  dsnet:
    driver: bridge
