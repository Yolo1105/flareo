version: '3'
services:
  model:
    build: ./model
    container_name: model
    hostname: model
    ports:
      - "9000:11434"   # 将容器内 11434 端口映射到宿主机 9000，用于外部调试
    networks:
      - dsnet

  chat:
    build: ./chat
    ports:
      - "8080:80"
    depends_on:
      - model
    networks:
      - dsnet

networks:
  dsnet:
    driver: bridge
