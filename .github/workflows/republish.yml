# ────────────────────────────────────────────────────────────────
# Republish workflow.
#
# Pulls pinned upstream images, re-tags into ECR Public, generates
# SBOM + Trivy scan, signs with cosign keyless via GHA OIDC, uploads
# artifacts to R2, and upserts Module metadata.
#
# Manual dispatch only for now. A scheduled job that fails quietly
# for months is worse than no schedule; the site will show
# lastRebuiltAt instead of asserting a cadence. (See T-303.)
# To re-enable a schedule later, restore the cron block below and
# confirm the pipeline is green under workflow_dispatch first.
#
# Required repo secrets:
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, ECR_PUBLIC_URL,
#   R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY,
#   R2_BUCKET_NAME, DATABASE_URL
# ────────────────────────────────────────────────────────────────

name: republish

on:
  # schedule:
  #   # Disabled until the pipeline has run successfully via
  #   # workflow_dispatch at least once (owner task O-4 / T-303).
  #   - cron: "0 2 * * 0"
  workflow_dispatch:
    inputs:
      only:
        description: "Republish only one module (slug). Leave empty to republish all."
        required: false
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: republish
  cancel-in-progress: false

defaults:
  run:
    working-directory: apps/web

jobs:
  rebuild:
    name: republish ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - vaultwarden
          - immich
          - jellyfin
          - homeassistant
          - nextcloud
          - paperlessngx
          - adguardhome
          - gitea
          - linkwarden
          - ntfy
          - uptimekuma
          - caddy

    steps:
      - name: skip if not selected
        if: ${{ inputs.only != '' && inputs.only != matrix.module }}
        run: |
          echo "skipping ${{ matrix.module }} (only=${{ inputs.only }})"
          exit 0

      - name: harden runner
        if: ${{ inputs.only == '' || inputs.only == matrix.module }}
        uses: step-security/harden-runner@c6295a65d1254861815972266d5933fd6e532bdf
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            public.ecr.aws:443
            auth.docker.io:443
            registry-1.docker.io:443
            production.cloudflare.docker.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            ${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com:443
            aws.amazon.com:443
            api.ecr-public.aws:443
            sts.amazonaws.com:443
            auth.ecr-public.aws:443
            api.us-east-1.amazonaws.com:443
            ec2.us-east-1.amazonaws.com:443
            ghga.anchore.io:443
            storage.googleapis.com:443

      - name: checkout
        if: ${{ inputs.only == '' || inputs.only == matrix.module }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: setup node
        if: ${{ inputs.only == '' || inputs.only == matrix.module }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: install project deps (for prisma + tsx)
        if: ${{ inputs.only == '' || inputs.only == matrix.module }}
        working-directory: .
        run: npm ci --ignore-scripts

      - name: generate prisma client
        if: ${{ inputs.only == '' || inputs.only == matrix.module }}
        run: npx prisma generate

      - name: install cosign
        if: ${{ inputs.only == '' || inputs.only == matrix.module }}
        uses: sigstore/cosign-installer@3454372f43399081ed03b604cb2d021dabca52bb
        with:
          cosign-release: v3.0.6

      - name: install trivy (pinned binary)
        if: ${{ inputs.only == '' || inputs.only == matrix.module }}
        run: |
          set -e
          TRIVY_VERSION="0.70.0"
          curl -fsSL -o /tmp/trivy.tgz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          sudo tar -xzf /tmp/trivy.tgz -C /usr/local/bin trivy
          trivy --version

      - name: install syft (pinned binary)
        if: ${{ inputs.only == '' || inputs.only == matrix.module }}
        run: |
          set -e
          SYFT_VERSION="1.42.4"
          curl -fsSL -o /tmp/syft.tgz \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          sudo tar -xzf /tmp/syft.tgz -C /usr/local/bin syft
          syft --version

      - name: configure AWS creds
        if: ${{ inputs.only == '' || inputs.only == matrix.module }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          echo "AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}" >> "$GITHUB_ENV"
          echo "AWS_REGION=us-east-1" >> "$GITHUB_ENV"

      - name: republish ${{ matrix.module }}
        if: ${{ inputs.only == '' || inputs.only == matrix.module }}
        env:
          ECR_PUBLIC_URL: ${{ secrets.ECR_PUBLIC_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: ./scripts/republish/republish.sh ${{ matrix.module }}

      - name: upload run artifacts
        if: ${{ always() && (inputs.only == '' || inputs.only == matrix.module) }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: republish-${{ matrix.module }}
          path: |
            /tmp/flareo-republish-*/artifacts/
          if-no-files-found: ignore
          retention-days: 30
