name: CLI CI

on:
  push:
    branches: [main]
    paths:
      - "packages/cli/**"
      - ".github/workflows/cli-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/cli/**"
      - ".github/workflows/cli-ci.yml"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # Dummy client ID so the main binary compiles in CI. Real client ID
  # is baked in at release time.
  FLAREO_GITHUB_CLIENT_ID: "Ov23liFAKEDEVCLIENTID"

defaults:
  run:
    working-directory: packages/cli

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b
        with:
          # 1.88+: comfy-table 7.2 uses let-chains; icu/idna need >=1.86.
          toolchain: "1.88"
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57  # v4.2.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/cli/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('packages/cli/Cargo.lock') }}

      - name: rustfmt --check
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: test
        run: cargo test --locked --all-features
