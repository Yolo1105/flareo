name: Web E2E

# Runs the Playwright suite against a temporary Next.js build.

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/web-e2e.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/web-e2e.yml"

concurrency:
  group: web-e2e-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/web

jobs:
  playwright:
    name: Playwright
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flareo
          POSTGRES_PASSWORD: flareo
          POSTGRES_DB: flareo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Use Node 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        working-directory: .
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://flareo:flareo@localhost:5432/flareo_test
        run: npx prisma generate

      # Migrations in this repo are incremental deltas against a schema that
      # was originally established with `db push`; they do not bootstrap an
      # empty database. Sync the full schema for CI instead.
      - name: Apply schema
        env:
          DATABASE_URL: postgresql://flareo:flareo@localhost:5432/flareo_test
        run: npx prisma db push

      - name: Seed demo data
        env:
          DATABASE_URL: postgresql://flareo:flareo@localhost:5432/flareo_test
          SEED: "1"
        run: npm run db:seed

      - name: Run Playwright tests
        env:
          DATABASE_URL: postgresql://flareo:flareo@localhost:5432/flareo_test
          NEXTAUTH_SECRET: e2e-test-secret-not-real
          NEXTAUTH_URL: http://localhost:3000
        run: npm run test:e2e

      - name: Upload trace + report on failure
        if: failure()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
