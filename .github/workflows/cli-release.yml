name: Release

# Triggered by pushing a tag like v0.1.0. Builds the `flareo` binary for
# macOS (arm64 + x86_64) and Linux (arm64 + x86_64, musl), signs each
# archive with cosign keyless via GitHub Actions OIDC, and publishes a
# GitHub Release with artifacts + a `install.sh` installer script.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (must already exist on main)'
        required: true

# Needed for cosign keyless signing.
permissions:
  contents: write
  id-token: write

env:
  BINARY_NAME: flareo
  CRATE_NAME: flareo

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/cli
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-22.04
            archive: tar.gz
          - target: aarch64-unknown-linux-musl
            os: ubuntu-22.04
            archive: tar.gz
            cross: true
          - target: x86_64-apple-darwin
            os: macos-13
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-14
            archive: tar.gz

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b  # stable (pinned)
        with:
          toolchain: "1.80"
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross (Linux arm64)
        if: matrix.cross
        run: cargo install cross --locked

      - name: Cache cargo registry
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57  # v4.2.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/cli/target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('packages/cli/Cargo.lock') }}

      - name: Build
        env:
          # Baked into the binary at build time; see src/commands/login.rs
          FLAREO_GITHUB_CLIENT_ID: ${{ secrets.FLAREO_GITHUB_CLIENT_ID }}
        run: |
          if [[ "${{ matrix.cross }}" == "true" ]]; then
            cross build --release --target ${{ matrix.target }} --locked
          else
            cargo build --release --target ${{ matrix.target }} --locked
          fi

      - name: Stage artifact
        id: stage
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if [[ -z "$tag" || "$tag" == "$GITHUB_REF" ]]; then
            tag="${{ github.event.inputs.tag }}"
          fi
          archive_name="${BINARY_NAME}-${tag}-${{ matrix.target }}.tar.gz"
          mkdir -p staging
          cp "target/${{ matrix.target }}/release/${BINARY_NAME}" "staging/${BINARY_NAME}"
          cp README.md LICENSE* staging/ 2>/dev/null || true
          tar -czf "$archive_name" -C staging .
          sha256sum "$archive_name" > "${archive_name}.sha256"
          echo "archive=$archive_name" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@4959ce089c160fddf62f7b42464195ba1a56d382  # v3.6.0
        with:
          cosign-release: 'v2.4.1'

      - name: Sign archive with cosign keyless
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign-blob \
            --bundle "${{ steps.stage.outputs.archive }}.cosign.bundle" \
            "${{ steps.stage.outputs.archive }}"

      - name: Upload artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with:
          name: ${{ matrix.target }}
          path: |
            packages/cli/${{ steps.stage.outputs.archive }}
            packages/cli/${{ steps.stage.outputs.archive }}.sha256
            packages/cli/${{ steps.stage.outputs.archive }}.cosign.bundle

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Download all artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16  # v4.1.8
        with:
          path: dist

      - name: Flatten artifacts
        run: |
          mkdir -p release-assets
          find dist -type f \( -name "*.tar.gz" -o -name "*.sha256" -o -name "*.cosign.bundle" \) -exec mv {} release-assets/ \;
          ls -la release-assets

      - name: Generate install.sh
        run: |
          cat > release-assets/install.sh <<'INSTALLER'
          #!/usr/bin/env sh
          # Flareo CLI installer. Detects your platform, downloads the
          # latest release archive from GitHub, verifies the cosign
          # signature if cosign is available, and installs to
          # $HOME/.local/bin/flareo (configurable via FLAREO_INSTALL_DIR).
          set -eu

          REPO="Yolo1105/flareo"
          BIN_NAME="flareo"
          INSTALL_DIR="${FLAREO_INSTALL_DIR:-$HOME/.local/bin}"

          detect_target() {
            uname_s="$(uname -s)"
            uname_m="$(uname -m)"
            case "$uname_s" in
              Linux)   os="unknown-linux-musl" ;;
              Darwin)  os="apple-darwin" ;;
              *) echo "Unsupported OS: $uname_s" >&2; exit 1 ;;
            esac
            case "$uname_m" in
              x86_64|amd64) arch="x86_64" ;;
              arm64|aarch64) arch="aarch64" ;;
              *) echo "Unsupported arch: $uname_m" >&2; exit 1 ;;
            esac
            echo "${arch}-${os}"
          }

          TARGET="$(detect_target)"
          echo "Detected platform: $TARGET"

          LATEST_JSON="$(curl -fsSL https://api.github.com/repos/$REPO/releases/latest)"
          TAG="$(printf '%s' "$LATEST_JSON" | sed -n 's/.*"tag_name": *"\(v[^"]*\)".*/\1/p' | head -1)"
          if [ -z "$TAG" ]; then
            echo "Could not determine latest version" >&2; exit 1
          fi

          ARCHIVE="${BIN_NAME}-${TAG}-${TARGET}.tar.gz"
          URL="https://github.com/$REPO/releases/download/$TAG/$ARCHIVE"

          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT

          echo "Downloading $URL"
          curl -fsSL -o "$TMP/$ARCHIVE" "$URL"
          curl -fsSL -o "$TMP/$ARCHIVE.sha256" "$URL.sha256"

          # sha256 check
          cd "$TMP"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum -c "$ARCHIVE.sha256"
          elif command -v shasum >/dev/null 2>&1; then
            expected="$(awk '{print $1}' "$ARCHIVE.sha256")"
            got="$(shasum -a 256 "$ARCHIVE" | awk '{print $1}')"
            [ "$expected" = "$got" ] || { echo "sha256 mismatch" >&2; exit 1; }
          fi

          # cosign verify (optional; skipped if cosign not installed)
          if command -v cosign >/dev/null 2>&1; then
            curl -fsSL -o "$ARCHIVE.cosign.bundle" "$URL.cosign.bundle"
            echo "Verifying cosign signature..."
            cosign verify-blob \
              --bundle "$ARCHIVE.cosign.bundle" \
              --certificate-identity-regexp 'https://github.com/Yolo1105/.+' \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              "$ARCHIVE" && echo "Signature verified."
          else
            echo "(cosign not installed; skipping signature verification)"
          fi

          mkdir -p "$INSTALL_DIR"
          tar -xzf "$ARCHIVE" "$BIN_NAME"
          install -m 0755 "$BIN_NAME" "$INSTALL_DIR/$BIN_NAME"

          echo ""
          echo "Installed: $INSTALL_DIR/$BIN_NAME"
          case ":$PATH:" in
            *":$INSTALL_DIR:"*) ;;
            *) echo "Note: $INSTALL_DIR is not on your \$PATH. Add this to your shell rc:" ;;
          esac
          "$INSTALL_DIR/$BIN_NAME" --version || true
          INSTALLER
          chmod +x release-assets/install.sh

      - name: Publish release
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191  # v2.1.0
        with:
          files: release-assets/*
          body: |
            Build from source (supported path until you trust these
            release archives):

            ```sh
            git clone https://github.com/Yolo1105/flareo.git
            cd flareo/packages/cli
            cargo build --release
            ```

            Or download an archive from this release and verify with
            cosign (optional but recommended):

            ```sh
            cosign verify-blob \
              --bundle flareo-<tag>-<target>.tar.gz.cosign.bundle \
              --certificate-identity-regexp 'https://github.com/Yolo1105/.+' \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              flareo-<tag>-<target>.tar.gz
            ```
          generate_release_notes: true
