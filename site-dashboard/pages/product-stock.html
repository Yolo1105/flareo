<!-- Product Stock Page -->
<div class="page-header">
  <h1>Product Stock</h1>
  <div class="actions">
    <button class="btn-primary" onclick="showAddProductModal()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 5v14M5 12h14"/>
      </svg>
      Add Product
    </button>
    <div class="search">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/>
        <path d="M21 21l-4.35-4.35"/>
      </svg>
      <input type="text" placeholder="Search product name" 
             hx-get="/api/products/search"
             hx-trigger="keyup changed delay:500ms"
             hx-target="#product-table-body">
    </div>
  </div>
</div>

<div class="content-wrapper">
  <div class="table-container">
    <table class="product-table">
      <thead>
        <tr>
          <th>Image</th>
          <th>Product Name</th>
          <th>Category</th>
          <th>Price</th>
          <th>Piece</th>
          <th>Available Color</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="product-table-body">
        <template id="product-row-template">
          <tr>
            <td class="product-image">
              <img src="/placeholder.svg" alt="Product Image">
            </td>
            <td class="product-name"></td>
            <td class="category"></td>
            <td class="price"></td>
            <td class="piece"></td>
            <td class="colors">
              <div class="color-dots"></div>
            </td>
            <td class="actions">
              <button class="edit-btn" aria-label="Edit product">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                  <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                </svg>
              </button>
              <button class="delete-btn" aria-label="Delete product">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M3 6h18"/>
                  <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/>
                  <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
                </svg>
              </button>
            </td>
          </tr>
        </template>
      </tbody>
    </table>

    <div class="pagination">
      <span>Showing 1-09 of 78</span>
      <div class="pagination-controls">
        <button class="prev" aria-label="Previous page">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M15 18l-6-6 6-6"/>
          </svg>
        </button>
        <button class="next" aria-label="Next page">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 18l6-6-6-6"/>
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Add Product Modal -->
<div id="add-product-modal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>Add New Product</h2>
      <button class="close-btn" onclick="hideAddProductModal()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 6L6 18M6 6l12 12"/>
        </svg>
      </button>
    </div>
    <form id="add-product-form" class="modal-body">
      <div class="form-group">
        <label for="product-image">Product Image</label>
        <div class="image-upload">
          <input type="file" id="product-image" accept="image/*" class="hidden">
          <div class="upload-placeholder">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
            <span>Click to upload or drag and drop</span>
            <span class="text-sm">SVG, PNG, JPG or GIF (max. 800x400px)</span>
          </div>
        </div>
      </div>
      <div class="form-group">
        <label for="product-name">Product Name</label>
        <input type="text" id="product-name" required>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="product-category">Category</label>
          <select id="product-category" required>
            <option value="">Select category</option>
            <option value="Digital Product">Digital Product</option>
            <option value="Laptop">Laptop</option>
            <option value="Mobile Phone">Mobile Phone</option>
            <option value="Audio">Audio</option>
            <option value="Tablet">Tablet</option>
            <option value="Accessories">Accessories</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Smart Home">Smart Home</option>
          </select>
        </div>
        <div class="form-group">
          <label for="product-price">Price</label>
          <input type="number" id="product-price" min="0" step="0.01" required>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="product-piece">Stock Quantity</label>
          <input type="number" id="product-piece" min="0" required>
        </div>
        <div class="form-group">
          <label>Available Colors</label>
          <div class="color-picker">
            <input type="color" value="#000000">
            <button type="button" class="add-color-btn">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 5v14M5 12h14"/>
              </svg>
            </button>
          </div>
          <div class="selected-colors"></div>
        </div>
      </div>
    </form>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="hideAddProductModal()">Cancel</button>
      <button class="btn-primary" onclick="submitProduct()">Add Product</button>
    </div>
  </div>
</div>

    }
  ];

  // Initialize product table
  function initializeTable() {
    const template = document.getElementById('product-row-template');
    const tbody = document.getElementById('product-table-body');
    tbody.innerHTML = ''; // Clear existing rows
    
    products.forEach(product => {
      const clone = template.content.cloneNode(true);
      
      clone.querySelector('img').src = product.image;
      clone.querySelector('.product-name').textContent = product.name;
      clone.querySelector('.category').textContent = product.category;
      clone.querySelector('.price').textContent = `$${product.price.toFixed(2)}`;
      clone.querySelector('.piece').textContent = product.piece;
      
      const colorDots = clone.querySelector('.color-dots');
      product.colors.forEach(color => {
        const dot = document.createElement('div');
        dot.className = 'color-dot';
        dot.style.backgroundColor = color;
        colorDots.appendChild(dot);
      });
      
      // Add HTMX attributes for actions
      const editBtn = clone.querySelector('.edit-btn');
      editBtn.setAttribute('hx-get', `/api/products/${product.id}/edit`);
      editBtn.setAttribute('hx-target', '#edit-modal');
      
      const deleteBtn = clone.querySelector('.delete-btn');
      deleteBtn.setAttribute('hx-delete', `/api/products/${product.id}`);
      deleteBtn.setAttribute('hx-confirm', 'Are you sure you want to delete this product?');
      deleteBtn.setAttribute('hx-target', 'closest tr');
      
      tbody.appendChild(clone);
    });

    updatePagination();
  }

  // Search functionality
  function setupSearch() {
    const searchInput = document.querySelector('.search input');
    searchInput.addEventListener('input', (e) => {
      const searchTerm = e.target.value.toLowerCase();
      let visibleCount = 0;
      
      document.querySelectorAll('#product-table-body tr').forEach(row => {
        const productName = row.querySelector('.product-name').textContent.toLowerCase();
        const show = productName.includes(searchTerm);
        row.style.display = show ? '' : 'none';
        if (show) visibleCount++;
      });

      updatePagination(visibleCount);
    });
  }

  // Update pagination text
  function updatePagination(visibleCount = products.length) {
    const paginationText = document.querySelector('.pagination span');
    paginationText.textContent = `Showing 1-${visibleCount} of ${products.length}`;
  }

  // Initialize when DOM is loaded
  document.addEventListener('DOMContentLoaded', () => {
    initializeTable();
    setupSearch();
  });

  let selectedColors = new Set();

  function showAddProductModal() {
    document.getElementById('add-product-modal').classList.add('active');
  }

  function hideAddProductModal() {
    document.getElementById('add-product-modal').classList.remove('active');
    resetForm();
  }

  function resetForm() {
    document.getElementById('add-product-form').reset();
    selectedColors.clear();
    document.querySelector('.selected-colors').innerHTML = '';
  }

  function setupImageUpload() {
    const uploadArea = document.querySelector('.image-upload');
    const fileInput = document.getElementById('product-image');

    uploadArea.addEventListener('click', () => fileInput.click());
    uploadArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadArea.style.borderColor = 'var(--primary-color)';
    });

    uploadArea.addEventListener('dragleave', () => {
      uploadArea.style.borderColor = 'var(--border-color)';
    });

    uploadArea.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadArea.style.borderColor = 'var(--border-color)';
      fileInput.files = e.dataTransfer.files;
      handleImageUpload(e.dataTransfer.files[0]);
    });

    fileInput.addEventListener('change', (e) => {
      handleImageUpload(e.target.files[0]);
    });
  }

  function handleImageUpload(file) {
    if (file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        const uploadArea = document.querySelector('.image-upload');
        uploadArea.innerHTML = `<img src="${e.target.result}" style="max-width: 100%; max-height: 200px; border-radius: 0.375rem;">`;
      };
      reader.readAsDataURL(file);
    }
  }

  function setupColorPicker() {
    const colorInput = document.querySelector('input[type="color"]');
    const addColorBtn = document.querySelector('.add-color-btn');
    const selectedColorsContainer = document.querySelector('.selected-colors');

    addColorBtn.addEventListener('click', () => {
      const color = colorInput.value;
      if (!selectedColors.has(color)) {
        selectedColors.add(color);
        const colorElement = document.createElement('div');
        colorElement.className = 'selected-color';
        colorElement.style.backgroundColor = color;
        colorElement.onclick = () => {
          selectedColors.delete(color);
          colorElement.remove();
        };
        selectedColorsContainer.appendChild(colorElement);
      }
    });
  }

  function submitProduct() {
    const form = document.getElementById('add-product-form');
    const formData = new FormData(form);
    
    // Add selected colors to form data
    formData.append('colors', Array.from(selectedColors));

    // Here you would typically send the data to your server
    console.log('Submitting product:', Object.fromEntries(formData));
    
    // For demo purposes, we'll just add it to the table
    const newProduct = {
      id: products.length + 1,
      image: document.querySelector('.image-upload img')?.src || '/placeholder.svg',
      name: formData.get('product-name'),
      category: formData.get('product-category'),
      price: parseFloat(formData.get('product-price')),
      piece: parseInt(formData.get('product-piece')),
      colors: Array.from(selectedColors)
    };

    products.push(newProduct);
    initializeTable();
    hideAddProductModal();
  }

  // Initialize modal functionality
  document.addEventListener('DOMContentLoaded', () => {
    setupImageUpload();
    setupColorPicker();
  });
</script>
