<!-- Orders Page -->
<div class="order-list-container">
  <!-- Filter Section -->
  <div class="filter-section">
    <div class="filter-group">
      <button class="filter-trigger" aria-label="Filter">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>
        </svg>
        Filter By
      </button>

      <!-- Date Filter -->
      <div class="filter-dropdown" data-filter="date">
        <button class="date-select" hx-get="/api/calendar" hx-target="#calendar-popup">
          <span class="selected-date">14 Feb 2019</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 9l6 6 6-6"/>
          </svg>
        </button>
      </div>

      <!-- Order Type Filter -->
      <div class="filter-dropdown" data-filter="type">
        <button class="type-select">
          Order Type
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 9l6 6 6-6"/>
          </svg>
        </button>
      </div>

      <!-- Order Status Filter -->
      <div class="filter-dropdown" data-filter="status">
        <button class="status-select">
          Order Status
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 9l6 6 6-6"/>
          </svg>
        </button>
      </div>

      <button class="reset-filter" hx-get="/api/orders" hx-target="#orders-table">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 3v18h18"/>
          <path d="M3 12h18"/>
        </svg>
        Reset Filter
      </button>
    </div>
  </div>

  <!-- Orders Table -->
  <div class="orders-table-container">
    <table class="orders-table" id="orders-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>NAME</th>
          <th>ADDRESS</th>
          <th>DATE</th>
          <th>TYPE</th>
          <th>STATUS</th>
        </tr>
      </thead>
      <tbody>
        <template id="order-row-template">
          <tr>
            <td class="order-id"></td>
            <td class="customer-name"></td>
            <td class="address"></td>
            <td class="date"></td>
            <td class="type"></td>
            <td class="status"></td>
          </tr>
        </template>
      </tbody>
    </table>

    <div class="pagination">
      <span class="showing-text">Showing 1-09 of 78</span>
      <div class="pagination-controls">
        <button class="prev" aria-label="Previous page">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M15 18l-6-6 6-6"/>
          </svg>
        </button>
        <button class="next" aria-label="Next page">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 18l6-6-6-6"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Filter Popups -->
  <div id="calendar-popup" class="popup"></div>
  <div id="type-popup" class="popup">
    <div class="type-options">
      <button class="type-option" data-type="health">Health & Medicine</button>
      <button class="type-option" data-type="book">Book & Stationary</button>
      <button class="type-option" data-type="services">Services & Industry</button>
      <button class="type-option" data-type="fashion">Fashion & Beauty</button>
      <button class="type-option" data-type="home">Home & Living</button>
      <button class="type-option" data-type="electronics">Electronics</button>
      <button class="type-option" data-type="mobile">Mobile & Phone</button>
      <button class="type-option" data-type="accessories">Accessories</button>
    </div>
    <button class="apply-btn">Apply Now</button>
  </div>
  <div id="status-popup" class="popup">
    <div class="status-options">
      <button class="status-option" data-status="completed">Completed</button>
      <button class="status-option" data-status="processing">Processing</button>
      <button class="status-option" data-status="rejected">Rejected</button>
      <button class="status-option" data-status="on-hold">On Hold</button>
      <button class="status-option" data-status="in-transit">In Transit</button>
    </div>
    <button class="apply-btn">Apply Now</button>
  </div>
</div>

<style>
  .order-list-container {
    padding: 2rem;
    background: var(--background-secondary, #f8fafc);
  }

  .filter-section {
    background: var(--background-primary, white);
    padding: 1rem;
    border-radius: 0.5rem;
    margin-bottom: 1.5rem;
    border: 1px solid var(--border-color, #e2e8f0);
  }

  .filter-group {
    display: flex;
    gap: 1rem;
    align-items: center;
  }

  .filter-trigger,
  .filter-dropdown button {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.5rem 1rem;
    border: 1px solid var(--border-color, #e2e8f0);
    border-radius: 0.375rem;
    background: var(--background-primary, white);
    color: var(--text-secondary, #64748b);
    cursor: pointer;
    transition: all 0.2s;
  }

  .filter-trigger:hover,
  .filter-dropdown button:hover {
    background: var(--background-hover, #f1f5f9);
  }

  .reset-filter {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.5rem 1rem;
    border: none;
    background: none;
    color: var(--error-color, #ef4444);
    cursor: pointer;
    transition: opacity 0.2s;
  }

  .reset-filter:hover {
    opacity: 0.8;
  }

  .orders-table-container {
    background: var(--background-primary, white);
    border-radius: 0.5rem;
    overflow: hidden;
    border: 1px solid var(--border-color, #e2e8f0);
  }

  .orders-table {
    width: 100%;
    border-collapse: collapse;
  }

  .orders-table th {
    text-align: left;
    padding: 1rem;
    background: var(--background-secondary, #f8fafc);
    color: var(--text-secondary, #64748b);
    font-weight: 500;
    border-bottom: 1px solid var(--border-color, #e2e8f0);
  }

  .orders-table td {
    padding: 1rem;
    border-bottom: 1px solid var(--border-color, #e2e8f0);
    color: var(--text-primary);
  }

  .status {
    display: inline-flex;
    padding: 0.25rem 0.75rem;
    border-radius: 1rem;
    font-size: 0.875rem;
    font-weight: 500;
  }

  .status[data-status="completed"] {
    background: var(--success-color-light, #dcfce7);
    color: var(--success-color, #16a34a);
  }

  .status[data-status="processing"] {
    background: var(--primary-color-light, #e0e7ff);
    color: var(--primary-color, #4f46e5);
  }

  .status[data-status="rejected"] {
    background: var(--error-color-light, #fee2e2);
    color: var(--error-color, #ef4444);
  }

  .status[data-status="on-hold"] {
    background: var(--warning-color-light, #fff7ed);
    color: var(--warning-color, #ea580c);
  }

  .status[data-status="in-transit"] {
    background: var(--secondary-color-light, #f3e8ff);
    color: var(--secondary-color, #a855f7);
  }

  .pagination {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1rem;
    border-top: 1px solid var(--border-color, #e2e8f0);
  }

  .pagination-controls {
    display: flex;
    gap: 0.5rem;
  }

  .pagination-controls button {
    padding: 0.5rem;
    border: 1px solid var(--border-color, #e2e8f0);
    border-radius: 0.375rem;
    background: var(--background-primary, white);
    color: var(--text-secondary, #64748b);
    cursor: pointer;
    transition: all 0.2s;
  }

  .pagination-controls button:hover {
    background: var(--background-hover, #f1f5f9);
    color: var(--text-primary);
  }

  .popup {
    display: none;
    position: absolute;
    background: var(--background-primary, white);
    border-radius: 0.5rem;
    box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    padding: 1rem;
    min-width: 200px;
    border: 1px solid var(--border-color, #e2e8f0);
    z-index: 100;
  }

  .popup.active {
    display: block;
  }

  .type-options,
  .status-options {
    display: grid;
    gap: 0.5rem;
  }

  .type-option,
  .status-option {
    text-align: left;
    padding: 0.5rem;
    border: none;
    background: none;
    cursor: pointer;
    border-radius: 0.25rem;
    color: var(--text-primary);
    transition: background-color 0.2s;
  }

  .type-option:hover,
  .status-option:hover {
    background: var(--background-hover, #f1f5f9);
  }

  .type-option.selected,
  .status-option.selected {
    background: var(--primary-color-light, #eff6ff);
    color: var(--primary-color, #4475F2);
  }

  .apply-btn {
    width: 100%;
    margin-top: 1rem;
    padding: 0.5rem;
    background: var(--primary-color, #4475F2);
    color: white;
    border: none;
    border-radius: 0.375rem;
    cursor: pointer;
    transition: background-color 0.2s;
  }

  .apply-btn:hover {
    background: var(--primary-color-dark, #3461D9);
  }

  /* Dark theme adjustments */
  .dark .order-list-container {
    background: var(--background-primary);
  }

  .dark .filter-section,
  .dark .orders-table-container,
  .dark .popup {
    background: var(--background-secondary);
  }
</style>

<script>
  // Sample data structure with more realistic mock data
  const orders = [
    {
      id: 'ORD001',
      name: 'Christine Brooks',
      address: '089 Kutch Green Apt. 448, New York',
      date: '04 Sep 2023',
      type: 'Electronics',
      status: 'completed'
    },
    {
      id: 'ORD002',
      name: 'Michael Chen',
      address: '742 Evergreen Terrace, Springfield',
      date: '05 Sep 2023',
      type: 'Health & Medicine',
      status: 'processing'
    },
    {
      id: 'ORD003',
      name: 'Sarah Johnson',
      address: '123 Main St, Boston',
      date: '06 Sep 2023',
      type: 'Fashion & Beauty',
      status: 'in-transit'
    },
    {
      id: 'ORD004',
      name: 'David Kim',
      address: '456 Oak Ave, Los Angeles',
      date: '07 Sep 2023',
      type: 'Book & Stationary',
      status: 'completed'
    },
    {
      id: 'ORD005',
      name: 'Emma Wilson',
      address: '789 Pine Rd, Chicago',
      date: '08 Sep 2023',
      type: 'Home & Living',
      status: 'on-hold'
    },
    {
      id: 'ORD006',
      name: 'James Brown',
      address: '321 Elm St, Houston',
      date: '09 Sep 2023',
      type: 'Mobile & Phone',
      status: 'rejected'
    },
    {
      id: 'ORD007',
      name: 'Sophia Garcia',
      address: '654 Maple Dr, Miami',
      date: '10 Sep 2023',
      type: 'Accessories',
      status: 'processing'
    },
    {
      id: 'ORD008',
      name: 'William Taylor',
      address: '987 Cedar Ln, Seattle',
      date: '11 Sep 2023',
      type: 'Services & Industry',
      status: 'completed'
    },
    {
      id: 'ORD009',
      name: 'Olivia Martinez',
      address: '147 Birch Rd, Denver',
      date: '12 Sep 2023',
      type: 'Electronics',
      status: 'in-transit'
    }
  ];

  // Filter state
  const filterState = {
    date: null,
    types: new Set(),
    statuses: new Set()
  };

  // Initialize the table
  function initializeTable() {
    const template = document.getElementById('order-row-template');
    const tbody = document.querySelector('.orders-table tbody');
    tbody.innerHTML = ''; // Clear existing rows
    
    orders.forEach(order => {
      const clone = template.content.cloneNode(true);
      
      clone.querySelector('.order-id').textContent = order.id;
      clone.querySelector('.customer-name').textContent = order.name;
      clone.querySelector('.address').textContent = order.address;
      clone.querySelector('.date').textContent = order.date;
      clone.querySelector('.type').textContent = order.type;
      
      const status = document.createElement('span');
      status.className = 'status';
      status.textContent = order.status.charAt(0).toUpperCase() + order.status.slice(1);
      status.dataset.status = order.status.toLowerCase();
      clone.querySelector('.status').replaceWith(status);
      
      tbody.appendChild(clone);
    });

    updatePagination();
  }

  // Filter handlers
  function setupFilters() {
    // Date filter
    const dateSelect = document.querySelector('.date-select');
    dateSelect.addEventListener('click', (e) => {
      const popup = document.getElementById('calendar-popup');
      closeAllPopups();
      popup.classList.toggle('active');
      
      // Position the popup
      const rect = dateSelect.getBoundingClientRect();
      popup.style.top = `${rect.bottom + 5}px`;
      popup.style.left = `${rect.left}px`;
    });

    // Type filter
    const typeSelect = document.querySelector('.type-select');
    typeSelect.addEventListener('click', (e) => {
      const popup = document.getElementById('type-popup');
      closeAllPopups();
      popup.classList.toggle('active');
      
      // Position the popup
      const rect = typeSelect.getBoundingClientRect();
      popup.style.top = `${rect.bottom + 5}px`;
      popup.style.left = `${rect.left}px`;
    });

    // Status filter
    const statusSelect = document.querySelector('.status-select');
    statusSelect.addEventListener('click', (e) => {
      const popup = document.getElementById('status-popup');
      closeAllPopups();
      popup.classList.toggle('active');
      
      // Position the popup
      const rect = statusSelect.getBoundingClientRect();
      popup.style.top = `${rect.bottom + 5}px`;
      popup.style.left = `${rect.left}px`;
    });

    // Type options
    document.querySelectorAll('.type-option').forEach(option => {
      option.addEventListener('click', (e) => {
        const type = option.dataset.type;
        option.classList.toggle('selected');
        
        if (option.classList.contains('selected')) {
          filterState.types.add(type);
        } else {
          filterState.types.delete(type);
        }
      });
    });

    // Status options
    document.querySelectorAll('.status-option').forEach(option => {
      option.addEventListener('click', (e) => {
        const status = option.dataset.status;
        option.classList.toggle('selected');
        
        if (option.classList.contains('selected')) {
          filterState.statuses.add(status);
        } else {
          filterState.statuses.delete(status);
        }
      });
    });

    // Apply filters
    document.querySelectorAll('.apply-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const popup = e.target.closest('.popup');
        popup.classList.remove('active');
        applyFilters();
      });
    });

    // Reset filters
    document.querySelector('.reset-filter').addEventListener('click', () => {
      filterState.date = null;
      filterState.types.clear();
      filterState.statuses.clear();
      
      // Reset UI
      document.querySelector('.selected-date').textContent = '14 Feb 2019';
      document.querySelectorAll('.type-option, .status-option').forEach(option => {
        option.classList.remove('selected');
      });
      
      applyFilters();
    });

    // Close popups when clicking outside
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.filter-dropdown') && !e.target.closest('.popup')) {
        closeAllPopups();
      }
    });
  }

  // Close all filter popups
  function closeAllPopups() {
    document.querySelectorAll('.popup').forEach(popup => {
      popup.classList.remove('active');
    });
  }

  // Apply filters to the table
  function applyFilters() {
    const rows = document.querySelectorAll('.orders-table tbody tr');
    let visibleCount = 0;
    
    rows.forEach(row => {
      let show = true;
      
      // Apply date filter
      if (filterState.date) {
        const rowDate = row.querySelector('.date').textContent;
        if (rowDate !== filterState.date) {
          show = false;
        }
      }
      
      // Apply type filter
      if (filterState.types.size > 0) {
        const rowType = row.querySelector('.type').textContent.toLowerCase();
        if (!Array.from(filterState.types).some(type => rowType.includes(type))) {
          show = false;
        }
      }
      
      // Apply status filter
      if (filterState.statuses.size > 0) {
        const rowStatus = row.querySelector('.status').dataset.status;
        if (!filterState.statuses.has(rowStatus)) {
          show = false;
        }
      }
      
      row.style.display = show ? '' : 'none';
      if (show) visibleCount++;
    });

    updatePagination(visibleCount);
  }

  // Update pagination text
  function updatePagination(visibleCount = orders.length) {
    const showingText = document.querySelector('.showing-text');
    showingText.textContent = `Showing 1-${visibleCount} of ${orders.length}`;
  }

  // Initialize when DOM is loaded
  document.addEventListener('DOMContentLoaded', () => {
    initializeTable();
    setupFilters();
  });
</script>
