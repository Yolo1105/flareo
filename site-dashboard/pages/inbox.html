    // Initialize email list with inbox emails
    function initializeEmails(category = 'inbox') {
      emailList.innerHTML = ''; // Clear existing emails
      const emails = emailsByCategory[category] || emailsByCategory.inbox;
      
      emails.forEach(email => {
        const clone = template.content.cloneNode(true);
        const item = clone.querySelector('.email-item');
        
        item.querySelector('.sender').textContent = email.sender;
        item.querySelector('.subject').textContent = email.subject;
        item.querySelector('.time').textContent = email.time;
        
        const label = document.createElement('span');
        label.className = `label label-${email.label.toLowerCase()}`;
        label.textContent = email.label;
        item.querySelector('.label').replaceWith(label);
        
        const starBtn = item.querySelector('.star-btn');
        starBtn.dataset.starred = email.starred;
        if (email.starred) {
          starBtn.querySelector('svg').style.fill = '#f59e0b';
          starBtn.querySelector('svg').style.stroke = '#f59e0b';
        }
        
        // Add HTMX attributes
        item.setAttribute('hx-get', `/api/emails/${email.id}`);
        starBtn.setAttribute('hx-post', `/api/emails/${email.id}/star`);
        starBtn.setAttribute('hx-swap', 'outerHTML');
        
        // Prevent star button click from triggering email item click
        starBtn.addEventListener('click', (e) => {
          e.stopPropagation();
        });
        
        emailList.appendChild(item);
      });

      // Update active category
      document.querySelector('.email-categories li.active')?.classList.remove('active');
      document.querySelector(`[data-category="${category}"]`)?.classList.add('active');
    }

    // Initialize with inbox
    initializeEmails();

    // Add event listeners for category navigation
    document.querySelectorAll('[data-category]').forEach(item => {
      item.addEventListener('click', () => {
        const category = item.dataset.category;
        initializeEmails(category);
      });
    });

    // Add event listeners for interactive elements
    document.querySelector('.compose-btn').addEventListener('click', () => {
      // TODO: Implement compose functionality
      console.log('Compose new email');
    });

    // Search functionality
    const searchInput = document.querySelector('.search-input');
    searchInput.addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase();
      document.querySelectorAll('.email-item').forEach(item => {
        const subject = item.querySelector('.subject').textContent.toLowerCase();
        const sender = item.querySelector('.sender').textContent.toLowerCase();
        const shouldShow = subject.includes(query) || sender.includes(query);
        item.style.display = shouldShow ? 'grid' : 'none';
      });
    });

    // Initialize chat functionality
    initializeChat();
    initializeMultiSelect();
    initializeLabelModal();
  });

  // Initialize chat functionality
  function initializeChat() {
    const emailItems = document.querySelectorAll('.email-item');
    const template = document.getElementById('chat-view-template');
    
    emailItems.forEach(item => {
      item.addEventListener('click', () => {
        if (state.multiSelectActive) {
          toggleEmailSelection(item);
          return;
        }

        const emailId = item.getAttribute('hx-get').split('/').pop();
        const email = findEmailById(emailId);
        if (!email) return;

        showChatView(email);
      });
    });
  }

  function showChatView(email) {
    const chatView = document.getElementById('chat-view-template').content.cloneNode(true);
    const container = chatView.querySelector('.chat-view');
    
    // Populate chat view
    container.querySelector('.sender-name').textContent = email.sender;
    const label = container.querySelector('.label');
    label.className = `label label-${email.label.toLowerCase()}`;
    label.textContent = email.label;

    // Add mock messages
    const messages = container.querySelector('.chat-messages');
    messages.innerHTML = `
      <div class="message received">
        <p>${email.subject}</p>
        <span class="time">${email.time}</span>
      </div>
    `;

    // Setup chat input
    const input = container.querySelector('.message-input');
    const sendBtn = container.querySelector('.send-btn');
    
    input.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage(messages, input);
    });
    
    sendBtn.addEventListener('click', () => sendMessage(messages, input));

    // Setup back button
    container.querySelector('.back-btn').addEventListener('click', () => {
      container.classList.remove('active');
      setTimeout(() => container.remove(), 300);
    });

    // Add to DOM and animate
    document.body.appendChild(container);
    requestAnimationFrame(() => container.classList.add('active'));
  }

  function sendMessage(messages, input) {
    if (!input.value.trim()) return;

    const message = document.createElement('div');
    message.className = 'message sent';
    message.innerHTML = `
      <p>${input.value}</p>
      <span class="time">${new Date().toLocaleTimeString()}</span>
    `;
    
    messages.appendChild(message);
    messages.scrollTop = messages.scrollHeight;
    input.value = '';
  }

  // Initialize multi-select functionality
  function initializeMultiSelect() {
    const emailList = document.querySelector('.email-list');
    
    // Enable multi-select on shift key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Shift' && !state.multiSelectActive) {
        state.multiSelectActive = true;
        emailList.classList.add('multi-select-active');
      }
    });

    document.addEventListener('keyup', (e) => {
      if (e.key === 'Shift' && state.multiSelectActive) {
        state.multiSelectActive = false;
        emailList.classList.remove('multi-select-active');
        state.selectedEmails.clear();
        document.querySelectorAll('.email-item.selected').forEach(item => {
          item.classList.remove('selected');
        });
      }
    });
  }

  function toggleEmailSelection(emailItem) {
    const emailId = emailItem.getAttribute('hx-get').split('/').pop();
    
    if (state.selectedEmails.has(emailId)) {
      state.selectedEmails.delete(emailId);
      emailItem.classList.remove('selected');
    } else {
      state.selectedEmails.add(emailId);
      emailItem.classList.add('selected');
    }
  }

  // Initialize label functionality
  function initializeLabelModal() {
    const template = document.getElementById('label-modal-template');
    const labelButtons = document.querySelectorAll('.label-option input');
    
    labelButtons.forEach(button => {
      button.addEventListener('change', () => {
        const value = button.value;
        if (button.checked) {
          state.selectedLabels.add(value);
        } else {
          state.selectedLabels.delete(value);
        }
      });
    });
  }

  // Helper functions
  function findEmailById(id) {
    for (const category in emailsByCategory) {
      const email = emailsByCategory[category].find(e => e.id.toString() === id);
      if (email) return email;
    }
    return null;
  }
</script>
