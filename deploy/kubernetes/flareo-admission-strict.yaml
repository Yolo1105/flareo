# Flareo admission policy — STRICTER variant.
#
# IMPORTANT: This variant introduces an external dependency in the
# admission path. At pod-create time Kyverno POSTs to a verify API you
# configure below. That means admission latency (~200-500ms) and
# availability are coupled to that endpoint: if it is unreachable and
# failurePolicy is Fail, pods matching public.ecr.aws/flareo/* will not
# be admitted.
#
# The base policy in flareo-admission.yaml has no such dependency — it
# verifies Sigstore signatures locally via Kyverno/cosign only. Prefer
# the base policy unless you explicitly need a live catalog-status check.
#
# Requires, on top of the base policy:
#   1. Image must be a Flareo-signed image
#   2. Image status from YOUR chosen verify endpoint must be acceptable
#
# Before applying: replace the url placeholder with an instance you
# trust — your own Flareo deployment, or another endpoint you have
# chosen. Do not point production clusters at a third-party URL you do
# not control.
#
# Requires Kyverno 1.11+ with image attestation verification.

apiVersion: kyverno.io/v2beta1
kind: ClusterPolicy
metadata:
  name: require-flareo-signature-strict
  annotations:
    policies.kyverno.io/title: "Require Flareo signatures (strict)"
    policies.kyverno.io/description: >-
      Require a valid Flareo Sigstore signature AND require the module's
      current status from a verify API the operator configures to be
      'verified' (not 'pending' or 'failing').
spec:
  validationFailureAction: Audit
  webhookTimeoutSeconds: 60
  failurePolicy: Fail
  rules:
    - name: verify-flareo-signature
      match:
        any:
          - resources:
              kinds: [Pod]
      verifyImages:
        - imageReferences:
            - "public.ecr.aws/flareo/*"
          mutateDigest: true
          required: true
          verifyDigest: true
          attestors:
            - entries:
                - keyless:
                    subject: "https://github.com/Yolo1105/*"
                    issuer: "https://token.actions.githubusercontent.com"
                    rekor:
                      url: "https://rekor.sigstore.dev"

    - name: check-flareo-module-status
      match:
        any:
          - resources:
              kinds: [Pod]
      context:
        - name: flareoCheck
          apiCall:
            method: POST
            service:
              # OPERATOR: replace with a verify API instance you trust.
              # Example: https://flareo.example.com/api/v1/verify
              url: https://REPLACE-ME.example.com/api/v1/verify
            data:
              - key: imageRef
                value: "{{request.object.spec.containers[0].image}}"
            jmesPath: "status"
      preconditions:
        all:
          - key: "{{request.object.spec.containers[0].image}}"
            operator: AnyIn
            value: ["public.ecr.aws/flareo/*"]
      validate:
        message: >-
          Image status is '{{flareoCheck}}' per the configured verify
          endpoint. Refusing to admit anything other than 'verified' or
          'signed'. To override, pin to a specific digest that was
          verified at an earlier time.
        deny:
          conditions:
            any:
              - key: "{{flareoCheck}}"
                operator: NotIn
                value: ["verified", "signed"]
