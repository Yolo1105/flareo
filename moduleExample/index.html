<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>随机名言模块</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f0f0f0;
    }
    #quote-box {
      background: #fff;
      border: 1px solid #ddd;
      padding: 20px;
      border-radius: 4px;
      box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
      max-width: 500px;
      margin-bottom: 20px;
    }
    button {
      padding: 10px 15px;
      background-color: #007BFF;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <h1>随机名言模块</h1>
  <div id="quote-box">
    <p id="quote">点击下方按钮获取一条名言</p>
  </div>
  <button onclick="newQuote()">获取新的名言</button>

  <script>
    // 定义一组名言
    var quotes = [
      "生活就像一盒巧克力，你永远不知道下一块是什么。",
      "不积跬步，无以至千里。",
      "天道酬勤。",
      "学如逆水行舟，不进则退。",
      "有志者事竟成。",
      "原神启动。"
    ];

    // 随机显示一条名言
    function newQuote() {
      var randomIndex = Math.floor(Math.random() * quotes.length);
      document.getElementById('quote').innerText = quotes[randomIndex];
    }
  </script>
</body>
</html>
