<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>宿主页面</title>
</head>
<body>
  <h1>宿主页面内容</h1>

  <!-- 添加组件容器 -->
  <div id="component-container"></div>

  <!-- 自动注入的脚本会在这里 -->
     <!-- 手动添加调用代码 -->
  <script>
    // 等待 DOM 加载完成后执行
    document.addEventListener('DOMContentLoaded', () => {
      WebPackage.injectComponent('#component-container');
    });
  </script>
</body>
</html>
